[build]
  command = "node build.js"
  publish = "_site"

# Video needs byte-range requests; long-cache the clips since their
# names never change once a night is published.
[[headers]]
  for = "/assets/events/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# /contact was on the old Wix site and is still in Google's index, but does
# not exist here. Send it to the enquiry form rather than a 404.
# (/about used to redirect here too; it is a real page again now.)
[[redirects]]
  from = "/contact"
  to = "/production/#enquire"
  status = 301
