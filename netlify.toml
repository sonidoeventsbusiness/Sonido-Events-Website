[build]
  command = "node build.js"
  publish = "_site"

# Video needs byte-range requests; long-cache the clips since their
# names never change once a night is published.
[[headers]]
  for = "/assets/events/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
