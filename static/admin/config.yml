# Sonido Events — site editor
#
# Saving here commits to GitHub, which triggers a Netlify rebuild.
# A change is live about a minute after you hit Publish.

backend:
  name: github
  repo: sonidoeventsbusiness/Sonido-Events-Website
  branch: main

media_folder: static/assets/uploads
public_folder: /assets/uploads

# Line breaks typed into a "text" field become line breaks on the page.

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: content/home.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: heroH1, label: Hidden page heading (for Google and screen readers), widget: string, hint: "Not visible — the logo is what people see" }
          - { name: heroSubHeading, label: Big heading under the logo, widget: text }
          - { name: heroButtonLabel, label: Hero button text, widget: string }
          - { name: heroButtonHref, label: Hero button link, widget: string }
          - { name: stripLeft, label: "Scrolling strip — left", widget: string }
          - { name: stripCentre, label: "Scrolling strip — centre", widget: string }
          - { name: stripRight, label: "Scrolling strip — right", widget: string }
          - { name: nextEventEyebrow, label: "Next event — small line", widget: string }
          - { name: nextEventHeading, label: "Next event — heading", widget: text }
          - { name: nextEventAside, label: "Next event — side note", widget: string }
          - { name: lastNightEyebrow, label: "Last night — small line", widget: string }
          - { name: lastNightHeading, label: "Last night — heading", widget: text }
          - { name: lastNightAside, label: "Last night — side note", widget: string }
          - { name: lastNightSlug, label: Which night to feature, widget: string, hint: "The folder name of the night, e.g. aug-2026" }
          - { name: lastNightFeatured, label: Which four clips to show, widget: list, field: { name: number, label: Clip number, widget: number } }
          - { name: lastNightNote, label: "Last night — note", widget: text }
          - { name: lastNightButtonLabel, label: "Last night — button text", widget: string }
          - { name: productionEyebrow, label: "Production — small line", widget: string }
          - { name: productionHeading, label: "Production — heading", widget: text }
          - { name: productionCopy, label: "Production — paragraph", widget: text }
          - { name: productionButtonLabel, label: "Production — button text", widget: string }
          - name: productionLinks
            label: "Production — small links"
            widget: list
            fields:
              - { name: label, label: Text, widget: string }
              - { name: href, label: Link, widget: string }

      - name: events
        label: Events page
        file: content/events.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: comingUpEyebrow, label: "Coming up - small line", widget: string }
          - { name: comingUpHeading, label: "Coming up - page heading", widget: text }
          - name: photos
            label: Photo pair
            widget: list
            fields:
              - { name: src, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string }
          - { name: archiveEyebrow, label: "Archive block — small line", widget: string }
          - { name: archiveHeading, label: "Archive block — heading", widget: text }
          - { name: archiveCopy, label: "Archive block — paragraph", widget: text }
          - { name: archiveButtonLabel, label: "Archive block — button text", widget: string }

      - name: production
        label: Event production page
        file: content/production.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: introEyebrow, label: Small line at the top, widget: string }
          - { name: introHeading, label: Page heading, widget: text }
          - { name: introCopy, label: Opening paragraph, widget: text }
          - { name: introButtonLabel, label: Top button text, widget: string }
          - { name: approachEyebrow, label: "How it works - small line", widget: string }
          - { name: approachHeading, label: "How it works - heading", widget: text }
          - { name: approachCopy, label: "How it works - paragraphs", widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - { name: servicesEyebrow, label: "Scope - small line", widget: string }
          - { name: servicesHeading, label: "Scope - heading", widget: text }
          - name: services
            label: Scope cards
            widget: list
            summary: "{{heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: copy, label: Paragraph, widget: text }
          - { name: servicesNote, label: Note under the cards, widget: text }
          - { name: hireEyebrow, label: "Hire link - small line", widget: string }
          - { name: hireHeading, label: "Hire link - heading", widget: text }
          - { name: hireCopy, label: "Hire link - paragraph", widget: text }
          - { name: hireButtonLabel, label: "Hire link - button text", widget: string }

      - name: hire
        label: Equipment hire page
        file: content/hire.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: introEyebrow, label: Small line at the top, widget: string }
          - { name: introHeading, label: Page heading, widget: text }
          - { name: introCopy, label: Opening paragraph, widget: text }
          - { name: introButtonLabel, label: Top button text, widget: string }
          - { name: packagesEyebrow, label: "Packages - small line", widget: string }
          - { name: packagesHeading, label: "Packages - heading", widget: text }
          - { name: packagesNote, label: "Packages - note beside the heading", widget: text }
          - name: packages
            label: Packages
            label_singular: package
            widget: list
            summary: "{{heading}} - {{price}}"
            fields:
              - { name: heading, label: Package name, widget: string }
              - { name: capacity, label: Crowd size, widget: string, hint: "e.g. Up to 80 people" }
              - { name: price, label: Price, widget: string, hint: "e.g. $120, or from $180" }
              - name: art
                label: Picture
                widget: select
                default: speakers
                options:
                  - { label: Two speakers on stands, value: speakers }
                  - { label: Two large speakers on stands, value: speakers-large }
                  - { label: Mixer and microphone, value: mixer-mic }
                  - { label: DJ controller, value: decks }
                  - { label: Speakers and DJ controller, value: pa-decks }
                  - { label: Subs, tops and DJ controller, value: full-system }
              - { name: items, label: What's included, widget: list, field: { name: item, label: Line, widget: string } }
              - { name: note, label: Note at the bottom, widget: text, required: false }
          - { name: elseHeading, label: "Something else - heading", widget: text }
          - { name: elseCopy, label: "Something else - paragraph", widget: text }
          - { name: elseButtonLabel, label: "Something else - button text", widget: string }
          - { name: termsEyebrow, label: "Terms - small line", widget: string }
          - name: terms
            label: Hire terms
            widget: list
            summary: "{{heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: copy, label: Paragraph, widget: text }

      - name: faq
        label: FAQ page
        file: content/faq.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: introEyebrow, label: Small line at the top, widget: string }
          - { name: introHeading, label: Page heading, widget: text }
          - { name: introCopy, label: Opening paragraph, widget: text }
          - { name: introButtonLabel, label: Top button text, widget: string }
          - name: groups
            label: Question groups
            label_singular: group
            widget: list
            summary: "{{heading}}"
            fields:
              - { name: heading, label: Group heading, widget: string }
              - name: items
                label: Questions
                label_singular: question
                widget: list
                summary: "{{question}}"
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: answer, label: Answer, widget: text }
          - { name: stillEyebrow, label: "Bottom block - small line", widget: string }
          - { name: stillHeading, label: "Bottom block - heading", widget: text }
          - { name: stillCopy, label: "Bottom block - paragraph", widget: text }
          - { name: stillButtonLabel, label: "Bottom block - button text", widget: string }

      - name: about
        label: About page
        file: content/about.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: introEyebrow, label: Small line at the top, widget: string }
          - { name: introHeading, label: Page heading, widget: text }
          - { name: introCopy, label: Opening paragraph, widget: text }
          - name: sections
            label: Sections
            widget: list
            summary: "{{heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: copy, label: Paragraph, widget: text }
          - { name: closingEyebrow, label: "Bottom block - small line", widget: string }
          - { name: closingHeading, label: "Bottom block - heading", widget: text }
          - { name: closingCopy, label: "Bottom block - paragraph", widget: text }
          - { name: closingButtonLabel, label: "Bottom block - button text", widget: string }

      - name: enquiry
        label: Enquiry form
        file: content/enquiry.json
        fields:
          - { name: eyebrow, label: Small line, widget: string }
          - { name: heading, label: Heading, widget: text }
          - { name: copy, label: Paragraph, widget: text }
          - { name: formIntro, label: "Form - intro line", widget: text }
          - { name: formNameLabel, label: "Form - name field", widget: string }
          - { name: formEmailLabel, label: "Form - email field", widget: string }
          - { name: formPhoneLabel, label: "Form - phone field", widget: string }
          - { name: formDateLabel, label: "Form - event date field", widget: string }
          - { name: formVenueLabel, label: "Form - venue field", widget: string }
          - { name: formGuestsLabel, label: "Form - guest count field", widget: string }
          - { name: formDetailsLabel, label: "Form - details field", widget: string }
          - { name: formDetailsHint, label: "Form - details placeholder", widget: text }
          - { name: formButtonLabel, label: "Form - button text", widget: string }
          - { name: instagramIntro, label: "Instagram - intro line", widget: string }
          - { name: instagramHireLabel, label: "Instagram - hire account description", widget: string }
          - { name: instagramEventsLabel, label: "Instagram - events account description", widget: string }
          - { name: thanksTitle, label: "Thank-you page - tab title", widget: string }
          - { name: thanksEyebrow, label: "Thank-you page - small line", widget: string }
          - { name: thanksHeading, label: "Thank-you page - heading", widget: text }
          - { name: thanksCopy, label: "Thank-you page - paragraph", widget: text }
          - { name: thanksButtonLabel, label: "Thank-you page - button text", widget: string }

      - name: shop
        label: Shop page
        file: content/shop.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: stageEyebrow, label: Small line, widget: string }
          - { name: stageHeading, label: Heading, widget: text }
          - { name: stageNote, label: Note, widget: text }
          - { name: stageButtonLabel, label: Button text, widget: string }
          - { name: signupEyebrow, label: "Shop list — small line", widget: string }
          - { name: signupHeading, label: "Shop list — heading", widget: text }
          - { name: signupCopy, label: "Shop list — paragraph", widget: text }

      - name: pastEvents
        label: Past events page
        file: content/past-events.json
        fields:
          - { name: title, label: Browser tab title, widget: string }
          - { name: description, label: Search engine description, widget: text }
          - { name: heroEyebrow, label: Small line at the top, widget: string }
          - { name: heroHeading, label: "Page heading — first line", widget: string }
          - { name: heroHeadingEm, label: "Page heading — second line (italic)", widget: string }
          - { name: heroCopy, label: Opening paragraph, widget: text }
          - { name: reelHintLeft, label: "Reel hint — left", widget: string }
          - { name: reelHintRight, label: "Reel hint — right", widget: string }
          - { name: outroEyebrow, label: "Replay block — small line", widget: string }
          - { name: outroHeading, label: "Replay block — heading", widget: text }
          - { name: nextEyebrow, label: "Next event block — small line", widget: string }
          - { name: nextHeading, label: "Next event block — heading", widget: text }
          - { name: nextCopy, label: "Next event block — paragraph", widget: text }
          - { name: nextButtonLabel, label: "Next event block — button text", widget: string }

      - name: signup
        label: Newsletter signup
        file: content/signup.json
        fields:
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: text }
          - { name: copy, label: The pitch, widget: text }
          - { name: nameLabel, label: "Field label — first name", widget: string }
          - { name: emailLabel, label: "Field label — email", widget: string }
          - { name: buttonLabel, label: Button text, widget: string }
          - { name: smallPrint, label: Small print under the button, widget: text }
          - { name: thanksTitle, label: "Thank-you page — browser tab title", widget: string }
          - { name: thanksEyebrow, label: "Thank-you page — small line", widget: string }
          - { name: thanksHeading, label: "Thank-you page — heading", widget: text }
          - { name: thanksCopy, label: "Thank-you page — paragraph", widget: text }
          - { name: thanksButtonLabel, label: "Thank-you page — button text", widget: string }

      - name: site
        label: Site-wide details
        file: content/site.json
        fields:
          - { name: brandName, label: Business name, widget: string }
          - { name: url, label: Website address, widget: string, hint: "Used for share cards and the sitemap — change this when the domain goes live" }
          - { name: shortDescription, label: One-line description of the business, widget: text }
          - { name: areaServed, label: Area served, widget: string }
          - name: services
            label: Services (used by Google to understand what you offer)
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Service name, widget: string, hint: "Name it the way people search, e.g. Sound system hire" }
              - { name: description, label: One-line description, widget: text }
          - { name: ogImage, label: Social share image, widget: image }
          - { name: themeColor, label: Browser theme colour, widget: string }
          - { name: defaultDescription, label: Fallback search description, widget: text }
          - { name: instagramEvents, label: Events Instagram link, widget: string }
          - { name: instagramEventsHandle, label: Events Instagram handle, widget: string }
          - { name: instagramHire, label: Hire Instagram link, widget: string }
          - { name: email, label: Contact email address, widget: string, hint: "Where enquiries and the footer link go" }
          - { name: emailLabel, label: "Footer label above the email", widget: string }
          - { name: instagramHireHandle, label: Hire Instagram handle, widget: string }
          - { name: footerCopyright, label: "Footer — copyright", widget: string }
          - { name: footerLocation, label: "Footer — location", widget: string }
          - { name: footerServices, label: "Footer — services", widget: string }
          - { name: footerFollowLabel, label: "Footer — follow label", widget: string }

  - name: upcoming
    label: Upcoming events
    files:
      - name: upcoming
        label: What's coming up
        file: content/upcoming.json
        fields:
          - name: events
            label: Events
            widget: list
            fields:
              - { name: dateDisplay, label: Date, widget: string, hint: "Shown big, e.g. 02 / 10" }
              - { name: dayLine, label: Day and year, widget: string, hint: "e.g. FRIDAY · 2026" }
              - { name: heading, label: Event name, widget: string }
              - { name: copy, label: Details, widget: text }
              - { name: buttonLabel, label: Button text, widget: string }
              - { name: buttonHref, label: Button link, widget: string }
              - { name: poster, label: Event poster, widget: image, required: false, hint: "Shown beside the event details. Leave empty for no poster." }
              - { name: posterAlt, label: Poster description, widget: string, required: false, hint: "For screen readers, e.g. Sonido Origins event poster" }

  - name: nights
    label: Past nights
    label_singular: night
    folder: content/nights
    extension: json
    format: json
    create: true
    identifier_field: slug
    summary: "{{title}} — {{dateLine}}"
    fields:
      - { name: slug, label: Folder name, widget: string, hint: "Must match the folder in assets/events, e.g. aug-2026" }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, hint: "Used to order the archive — newest first" }
      - { name: title, label: Title, widget: string, hint: "Shown big, e.g. 21.08.26" }
      - { name: eyebrow, label: Small line above the title, widget: string, required: false }
      - { name: dateLine, label: Full date, widget: string, hint: "e.g. Friday 21 August 2026" }
      - { name: location, label: Location, widget: string }
      - name: clips
        label: Clips
        label_singular: clip
        widget: list
        summary: "{{number}} · {{time}} — {{caption}}"
        fields:
          - { name: number, label: Number, widget: string, hint: "Two digits, e.g. 07" }
          - { name: time, label: Time, widget: string, hint: "e.g. 23:53" }
          - { name: caption, label: Caption, widget: string, hint: "e.g. Peak time" }
          - { name: loop, label: Silent loop file, widget: string }
          - { name: full, label: Full clip file, widget: string }
          - { name: poster, label: Poster image, widget: string }
